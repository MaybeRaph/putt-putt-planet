<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4aa8ff" />
    <title>Putt-Putt Planet</title>
    <!-- Fonts are bundled locally (src/main.ts): no render-blocking network request, works offline. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>"
    />
  </head>
  <body>
    <!-- Painted instantly, before any JS downloads; removed by Game.start(). -->
    <div
      id="boot"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #4aa8ff, #bfe6ff);
        font-family: system-ui, sans-serif;
        z-index: 100;
        transition: opacity 0.4s;
      "
    >
      <div
        style="
          width: 54px;
          height: 54px;
          border-radius: 50%;
          background: #fff;
          box-shadow: inset -6px -6px 0 #dfe8f3;
          animation: bootb 0.7s infinite alternate cubic-bezier(0.5, 0, 1, 0.5);
        "
      ></div>
      <div style="color: #fff; font-weight: 800; font-size: 22px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15)">
        Putt-Putt Planet
      </div>
      <style>
        @keyframes bootb {
          to {
            transform: translateY(-36px);
          }
        }
      </style>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
